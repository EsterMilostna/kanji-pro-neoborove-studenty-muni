<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kanji – dvojitý kvíz (čtení + význam)</title>

<style>
:root{
  --bg:#0b1220;--card:#101a2e;--muted:#7c8aa5;
  --accent:#7aa2ff;--good:#35c759;--bad:#ff453a;--text:#e6ecff;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui,"Noto Sans JP",sans-serif;
  background:#0b1220;color:var(--text);
  display:grid;place-items:center;padding:24px
}
.wrap{width:min(900px,100%);display:grid;gap:16px}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  backdrop-filter:blur(6px)
}
h1{margin:0 0 4px;font-size:clamp(20px,3.6vw,28px)}
.sub{color:var(--muted);font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
@media(min-width:820px){
  .grid{grid-template-columns:1.1fr .9fr;align-items:start}
}
.kanji{
  font-size:clamp(48px,8vw,72px);font-weight:900;letter-spacing:.04em;
}
.btn{
  border:1px solid rgba(255,255,255,.15);background:#0f1b35;
  color:var(--text);padding:10px 14px;border-radius:12px;
  cursor:pointer;font-weight:600
}
.btn.primary{
  background:linear-gradient(180deg,#2748ff,#1b2dcc);
  border-color:#2b43ff
}
.choice{
  padding:10px 12px;border:1px solid rgba(255,255,255,.15);
  border-radius:12px;background:#1b2645;color:var(--text);
  cursor:pointer;transition:background .2s,transform .1s;
}
.choice:hover{
  background:#223060;transform:translateY(-1px);
}
.choice.selected{
  background:var(--accent);color:#fff;font-weight:600;
}
.small{font-size:12px;color:var(--muted)}
.hr{height:1px;background:rgba(255,255,255,.08);margin:10px 0}
.result{min-height:24px;font-weight:800;margin-top:8px}
.ok{color:var(--good)} .bad{color:var(--bad)}
.stat{
  padding:10px;border-radius:10px;background:#0d1730;
  border:1px solid rgba(255,255,255,.08);text-align:center
}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
</style>
</head>

<body>
<div class="wrap">

  <div class="card">
    <h1>Kanji – kvíz: vyber čtení i význam</h1>
    <div class="sub">Zobrazí se <b>kanji / čtení / význam</b> → vyber správné dvojice. Obě volby musí být správně.</div>
  </div>

  <div class="card">
    <div class="row">
      
      <label><input type="checkbox" id="noRepeat" checked> Bez opakování</label>
      <label><input type="checkbox" id="autoNext"> Po chybě automaticky dál</label>

      <label>Báze:
        <select id="base">
          <option value="kanji">Kanji → čtení + význam</option>
          <option value="reading">Čtení → kanji + význam</option>
          <option value="meaning">Význam → kanji + čtení</option>
        </select>
      </label>

      <label>Rozsah kanji:
        <input id="rangeFrom" type="number" min="1" max="125" value="1" style="width:4.5em">
        –
        <input id="rangeTo" type="number" min="1" max="125" value="179" style="width:4.5em">
      </label>

      <button id="applyRange" class="btn">Nastavit</button>
      <button id="reset" class="btn">↺ Reset</button>

    </div>
  </div>

  <div class="grid">

    <div class="card">
      <div class="small" id="promptLabel">Kanji</div>
      <div id="kanji" class="kanji">—</div>

      <div class="hr"></div>
      <div class="small" id="labelGroup1">Vyber čtení (kana)</div>
      <div id="readingChoices" class="select"></div>

      <div class="small" style="margin-top:10px" id="labelGroup2">Vyber význam (česky)</div>
      <div id="meaningChoices" class="select"></div>

      <div class="row" style="margin-top:12px">
        <button id="submit" class="btn primary">Potvrdit</button>
        <button id="skip" class="btn">Přeskočit</button>
      </div>

      <div id="feedback" class="result"></div>
    </div>

    <div class="card">
      <div class="small">📊 Statistiky</div>
      <div class="hr"></div>

      <div class="stats">
        <div class="stat"><div class="small">Správně</div><div id="ok">0</div></div>
        <div class="stat"><div class="small">Chybně</div><div id="bad">0</div></div>
        <div class="stat"><div class="small">Série</div><div id="streak">0</div></div>
        <div class="stat"><div class="small">Čas</div><div id="time">0:00</div></div>
      </div>
    </div>

  </div>
</div>

const nfkc = s => s.normalize("NFKC").trim();

function formatTime(sec){
  const m=Math.floor(sec/60);
  return m+":"+String(sec%60).padStart(2,"0");
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function filterByRange(words, from, to) {
  return words.filter(w =>
    w.kanjiIds.every(id => id >= from && id <= to)
  );
}

const els={
  noRepeat:document.getElementById("noRepeat"),
  autoNext:document.getElementById("autoNext"),
  base:document.getElementById("base"),
  rangeFrom:document.getElementById("rangeFrom"),
  rangeTo:document.getElementById("rangeTo"),
  applyRange:document.getElementById("applyRange"),
  reset:document.getElementById("reset"),
  submit:document.getElementById("submit"),
  skip:document.getElementById("skip"),
  kanji:document.getElementById("kanji"),
  readingChoices:document.getElementById("readingChoices"),
  meaningChoices:document.getElementById("meaningChoices"),
  feedback:document.getElementById("feedback"),
  ok:document.getElementById("ok"),
  bad:document.getElementById("bad"),
  streak:document.getElementById("streak"),
  time:document.getElementById("time"),
  promptLabel:document.getElementById("promptLabel"),
  labelGroup1:document.getElementById("labelGroup1"),
  labelGroup2:document.getElementById("labelGroup2")
};

function startClock(){
  if(timer) clearInterval(timer);
  start=Date.now();
  timer=setInterval(()=>{
    const s=Math.floor((Date.now()-start)/1000);
    els.time.textContent=formatTime(s);
  },500);
}

function updateStats(){
  els.ok.textContent=ok;
  els.bad.textContent=bad;
  els.streak.textContent=streak;
}

function renderChoices(it){
  const base=els.base.value;
  const others=pool.filter(x=>x!==it);

  const kanjiSet=new Set([it.surface]);
  shuffle(others).slice(0,3).forEach(x=>kanjiSet.add(x.surface));
  const kanjiArr=shuffle([...kanjiSet]);

  const readingSet=new Set([it.readingOK]);
  shuffle(others).slice(0,3).forEach(x=>readingSet.add(x.readingOK[0]));
  const readingArr=shuffle([...readingSet]);

  const meaningSet=new Set([it.meaning]);
  shuffle(others).slice(0,3).forEach(x=>meaningSet.add(x.meaning));
  const meaningArr=shuffle([...meaningSet]);

  els.readingChoices.innerHTML="";
  els.meaningChoices.innerHTML="";

  if(base==="kanji"){
    els.promptLabel.textContent="Kanji";
    els.kanji.textContent=it.surface;

    els.labelGroup1.textContent="Vyber čtení (kana)";
    els.labelGroup2.textContent="Vyber význam (česky)";

    els.readingChoices.innerHTML=readingArr
      .map(r=>`<button class="choice" data-type="reading" data-val="${r}">${r}</button>`).join("");

    els.meaningChoices.innerHTML=meaningArr
      .map(m=>`<button class="choice" data-type="meaning" data-val="${m}">${m}</button>`).join("");
  }
  else if(base==="reading"){
    els.promptLabel.textContent="Čtení (kana)";
    els.kanji.textContent=it.readingOK[0];

    els.labelGroup1.textContent="Vyber kanji";
    els.labelGroup2.textContent="Vyber význam";

    els.readingChoices.innerHTML=kanjiArr
      .map(k=>`<button class="choice" data-type="kanji" data-val="${k}">${k}</button>`).join("");

    els.meaningChoices.innerHTML=meaningArr
      .map(m=>`<button class="choice" data-type="meaning" data-val="${m}">${m}</button>`).join("");
  }
  else{
    els.promptLabel.textContent="Význam";
    els.kanji.textContent=it.meaning;

    els.labelGroup1.textContent="Vyber kanji";
    els.labelGroup2.textContent="Vyber čtení";

    els.readingChoices.innerHTML=kanjiArr
      .map(k=>`<button class="choice" data-type="kanji" data-val="${k}">${k}</button>`).join("");

    els.meaningChoices.innerHTML=readingArr
      .map(r=>`<button class="choice" data-type="reading" data-val="${r}">${r}</button>`).join("");
  }

  [...document.querySelectorAll(".choice")].forEach(btn=>{
    btn.onclick=()=>{
      const g=btn.dataset.type;
      [...document.querySelectorAll(`.choice[data-type="${g}"]`)]
        .forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
    };
  });
}

function nextQuestion(){
  if(pool.length===0){
    els.feedback.textContent="🛈 Žádná slovíčka v rozsahu.";
    return;
  }
  if(els.noRepeat.checked){
    if(queue.length===0){
      queue=pool.map((_,i)=>i);
      shuffle(queue);
    }
    current=queue.shift();
  }else{
    current=Math.floor(Math.random()*pool.length);
  }
  els.feedback.textContent="";
  renderChoices(pool[current]);
}

function check(){
  const it=pool[current];
  const base=els.base.value;

  let type1,type2;
  if(base==="kanji"){ type1="reading"; type2="meaning"; }
  else if(base==="reading"){ type1="kanji"; type2="meaning"; }
  else{ type1="kanji"; type2="reading"; }

  const sel1=document.querySelector(`.choice[data-type="${type1}"].selected`);
  const sel2=document.querySelector(`.choice[data-type="${type2}"].selected`);

  if(!sel1||!sel2){
    els.feedback.textContent="💡 Vyber obě odpovědi.";
    return;
  }

  const v1=sel1.dataset.val;
  const v2=sel2.dataset.val;

  const ok1 = (type1==="kanji"&&v1===it.surface)
           || (type1==="reading"&&v1===it.readingOK[0])
           || (type1==="meaning"&&v1===it.meaning);

  const ok2 = (type2==="kanji"&&v2===it.surface)
           || (type2==="reading"&&v2===it.readingOK[0])
           || (type2==="meaning"&&v2===it.meaning);

  if(ok1 && ok2){
    ok++; streak++;
    els.feedback.textContent="✅ Správně!";
    updateStats();
    setTimeout(nextQuestion,450);
  } else {
    bad++; streak=0;
    els.feedback.textContent=`❌ Správně má být: ${it.surface} [${it.readingOK[0]}] = ${it.meaning}`;
    updateStats();
    if(els.autoNext.checked) setTimeout(nextQuestion,900);
  }
}


/* ============================================================
   🔧 OVLÁDÁNÍ
   ============================================================ */

els.submit.onclick = check;
els.skip.onclick = ()=>{ bad++; streak=0; updateStats(); nextQuestion(); };
els.base.onchange = ()=> nextQuestion();

els.reset.onclick = ()=>{
  ok=bad=streak=0;
  updateStats();
  els.applyRange.onclick();
};

els.applyRange.onclick = ()=>{
  const from=Number(els.rangeFrom.value);
  const to=Number(els.rangeTo.value);

  pool = filterByRange(WORDS, from, to);
  queue = pool.map((_,i)=>i);
  shuffle(queue);

  ok=bad=streak=0;
  updateStats();

  nextQuestion();
  startClock();
};


/* ============================================================
   🚀 START
   ============================================================ */

els.applyRange.onclick();

</script>
</body>
</html>
